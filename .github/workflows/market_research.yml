name: Bounded market research

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataforge-market-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify collection and storage safeguards
        run: python -m unittest tests.test_market_research -v
      - name: Collect and archive bounded private observations
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m src.ops.market_research --publish
      - name: Preserve snapshot and publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-research-${{ github.run_id }}
          path: research-review/
          retention-days: 14
