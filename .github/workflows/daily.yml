name: Daily state snapshot

# TWICE a day, deliberately. These are eth_call reads of contract STATE, and free endpoints do not
# retain archive depth -- so unlike event data, a missed run is a PERMANENT hole that no later
# backfill can repair. GitHub states scheduled runs are best-effort and may be delayed or dropped,
# so a second attempt converts a dropped run from data loss into a non-event.
#
# Times are off the top of the hour: GitHub's cron queue is busiest on the hour, a lesson already
# written into the trading bot's own workflow.
#
# Secrets: DATA_REPO_SSH_KEY (deploy key, scoped to the data repo) and HF_TOKEN.
# No RPC key is needed anywhere in this project -- forward logging reads the chain tip.

on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '17 14 * * *'
  workflow_dispatch:

concurrency:
  # Never let the 02:17 and 14:17 runs overlap; both write the same dated partition.
  group: dataforge-daily
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write        # only to raise the quarterly re-pin reminder, nothing else
    # RAISED FROM 90 ON MEASUREMENT, not on principle. The last two runs took 76.4 and 69.0
    # minutes, i.e. 14-21 minutes of headroom, and the universe grows every week as discovery
    # finds new markets and vaults -- so the job was on track to start timing out on its own.
    # A state snapshot is backfillable and cheap to lose, but a workflow that fails on schedule
    # is noise that hides real failures, which is the thing worth avoiding.
    timeout-minutes: 180
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out private data repo into data/
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dataforge-data
          # A DEPLOY KEY scoped to this one repo, not a personal access token. A PAT would carry
          # the owner's rights across every repo they own; this key can write to dataforge-data
          # and nothing else. It is also the only secret this project needs -- the loggers read
          # the chain tip from free public endpoints, so there is no RPC key to leak.
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily snapshot
        id: snap
        continue-on-error: true      # push whatever succeeded before judging the run
        run: python -m src.ops.daily

      - name: Commit and push data
        working-directory: data
        run: |
          git config user.name "dataforge[bot]"
          git config user.email "dataforge@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no new partitions"
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%d)"
            git push || (git pull --rebase --autostash && git push)
          fi

      - name: Push to HuggingFace
        # Runs AFTER the git push, never instead of it. An HF outage must not cost an ephemeral
        # window, so git remains the primary destination and this is additive. hf_push exits 0
        # even on failure for the same reason: losing a push is recoverable, losing a window is not.
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OWNER: dataforge-labs
        run: python -m src.ops.hf_push

      - name: Remind me to re-pin the sample window
        # The sentinel appears only once the pinned week passes DF_SAMPLE_REPIN_DAYS. An
        # issue is the one channel here that reaches an inbox without someone thinking to
        # open the Actions tab, which is exactly what a quarterly chore needs -- the warning
        # printed into the log of a GREEN run was a diary entry by another name.
        if: always() && hashFiles('.repin_needed') != ''
        continue-on-error: true      # a missed reminder must never fail a collection run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Re-pin the public sample window"
          if gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title' | grep -qxF "$TITLE"; then
            echo "reminder already open, not duplicating"
          else
            gh issue create --title "$TITLE" --body "$(cat .repin_needed)"
          fi

      - name: Gap check
        run: python -m src.ops.gapcheck

      - name: Fail if the snapshot step failed
        if: steps.snap.outcome == 'failure'
        run: |
          echo "one or more loggers failed -- see the run log above"
          exit 1
