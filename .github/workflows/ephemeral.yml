name: Ephemeral collector

# THE ONLY DATA IN THIS PROJECT THAT IS GENUINELY UN-BACKFILLABLE.
#
# Phase 1 collects contract state, and that premise turned out to be false: free endpoints serve
# historical state to -720d, so all of it is retroactively obtainable. Pending transactions are
# not. They are gossiped on the p2p network and either get mined -- at which point the body
# becomes permanent but the TIMING does not -- or they vanish leaving no trace in any archive.
#
# RESIDENT, NOT CRON-SAMPLED. A sparse snapshot cannot see lifecycle: how long a transaction sat
# pending, or that it was dropped. So each job polls continuously for ~5.5h. Actions caps a job at
# 6h, so 5.5h leaves margin for setup and the final reconciliation read.
#
# FOUR STARTS AT 6h INTERVALS give ~22h/day coverage with ~30min gaps. The gaps are real and are
# visible in e0_run_manifest -- an ephemeral gap cannot be repaired, so it is recorded rather than
# hidden.
#
# Secrets: DATA_REPO_SSH_KEY (deploy key) and HF_TOKEN. The ephemeral SOURCES are all
# free and unauthenticated -- these secrets are for storage and distribution only.

on:
  schedule:
    - cron: '7 0 * * *'
    - cron: '7 6 * * *'
    - cron: '7 12 * * *'
    - cron: '7 18 * * *'
  # WINDOW LENGTH IS 4.5h, NOT 5.5h, and the reason is scheduling jitter rather than the job
  # limit. Observed start delays on this repo run 50 minutes to 1.8 hours against the cron time,
  # so a 5.5h window inside a 6h slot regularly overran into the next slot; the concurrency group
  # then dropped the later trigger and a whole window was skipped. 4.5h leaves ~1.5h of slack, so
  # four windows a day actually run instead of three unpredictably landing.
  workflow_dispatch:
    inputs:
      duration_s:
        description: 'Run duration in seconds (default 19800 = 5.5h)'
        required: false
        default: '16200'

concurrency:
  # Windows must not overlap: two collectors would double-write the same run partition and
  # double-count the mempool.
  group: dataforge-ephemeral
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # 5h50m against a 4.5h loop (DF_DURATION_S=16200).
                                # This bounds the JOB, not the run: `gh run list` reports
                                # wall-clock from run CREATION, which includes queue wait for a
                                # runner (observed 50min-1.8h). A 5h45m entry there is a ~4h
                                # job that waited 1h45m. Measured step times: Collect 4h30m,
                                # harmonise 3s, HF push 9-15s -- there is no post-processing
                                # creep, and reading the two as one number invents a crisis.
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out private data repo into data/
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dataforge-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        id: collect
        continue-on-error: true      # always push what was collected before judging the run
        env:
          DF_DURATION_S: ${{ github.event.inputs.duration_s || '16200' }}
          DF_POLL_S: '5'
          DF_DIVERGENCE_EVERY_S: '300'
          DF_CHECKPOINT_EVERY_S: '1800'
        run: python -m src.ops.longpoll

      - name: Harmonise partition schemas
        # Collectors gain columns over time, and partitions written before a change keep the old
        # schema -- which silently makes the dataset un-loadable as a whole (HF's viewer breaks,
        # load_dataset errors, pd.concat only APPEARS to work). Runs before the push so drift
        # never reaches the published data. Only ever ADDS null columns; never drops or rewrites.
        if: always()
        run: python -m src.ops.harmonise

      - name: Commit and push data
        # Was: push, and on rejection pull --rebase. That lost a full 5.5h window on
        # 2026-08-26 when a concurrent change to the data repo produced a modify/delete
        # conflict the rebase could not resolve, leaving the checkout detached with nothing
        # pushed -- while the HF push failed the same run on a rotated token. Our commit is a
        # SET OF NEW FILES, not a change to shared history, so it is now re-applied onto the
        # remote's state instead of replayed in order. See src/ops/push_data.py.
        env:
          DF_RUN_ID: ${{ github.run_id }}
        run: python -m src.ops.push_data

      - name: Push to HuggingFace
        # Runs AFTER the git push, never instead of it. An HF outage must not cost an ephemeral
        # window, so git remains the primary destination and this is additive. hf_push exits 0
        # even on failure for the same reason: losing a push is recoverable, losing a window is not.
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OWNER: dataforge-labs
        run: python -m src.ops.hf_push

      - name: Apply listed HF deletions
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OWNER: dataforge-labs
        run: python -m src.ops.hf_delete

      - name: Prune git to a rolling buffer
        # The data repo grows ~165 MB/day and GitHub refuses around 5 GB, so without this the
        # pipeline stops in about five weeks. HuggingFace holds the full history; git keeps the
        # last 14 days as insurance against an HF outage during a window. Refuses to delete
        # anything the HF receipt does not confirm was uploaded.
        if: always()
        env:
          DF_GIT_RETAIN_DAYS: '14'
        run: python -m src.ops.prune_git

      - name: Commit the prune
        if: always()
        working-directory: data
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "prune: rolling buffer $(date -u +%Y-%m-%d)"
          git push || (git pull --rebase --autostash && git push) || true

      - name: Fail if the collector errored
        if: steps.collect.outcome == 'failure'
        run: |
          echo "collector reported failures -- data above was still pushed"
          exit 1
